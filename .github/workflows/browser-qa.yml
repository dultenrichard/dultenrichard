name: New website browser QA
on:
  push:
    branches: ["rebuild/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npm run dev > /tmp/site.log 2>&1 &
          for i in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/site.log
          exit 1
      - name: Browser layout and interactions
        run: node tests/browser-smoke.mjs
      - name: Save preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: in-good-company-screenchecks
          path: artifacts/
          retention-days: 14
